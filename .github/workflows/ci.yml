name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test --project tests/Incremental.Tests -c Release --no-build
      # No broker in CI: the integration tests skip, and the ones that need none
      # (SnapshotCutTests) run.
      - name: Test Kafka
        run: dotnet test --project tests/Incremental.Kafka.Tests -c Release --no-build
      # In memory throughout: the service's tests need no broker. They load real plugin
      # assemblies from the test plugin projects' output directories, which the build made.
      - name: Test Service
        run: dotnet test --project tests/Incremental.Service.Tests -c Release --no-build
      # The example plugin's own tests: its definitions on PipelineTestHarness, as a
      # plugin author would write them.
      - name: Test example pipelines
        run: dotnet test --project examples/Incremental.EnrichmentService/Pipelines.Tests -c Release --no-build
      # The smoke tests that need no broker. Each drives the example through its admin API
      # (or prints its narrative), checks every claim against a model and exits 1 on one
      # that does not hold. A few seconds each.
      - name: Smoke, enrichment service on one in-memory node
        run: dotnet run -c Release --no-build --project examples/Incremental.EnrichmentService -- --headless
      - name: Smoke, enrichment service on two in-memory nodes with a takeover
        run: dotnet run -c Release --no-build --project examples/Incremental.EnrichmentService -- --headless --nodes 2
      - name: Smoke, trade enrichment on shared tables
        run: dotnet run -c Release --no-build --project examples/Incremental.TradeEnrichment
      # Validates the NuGet packaging (metadata, XML docs, SourceLink, symbols) on every build.
      - name: Pack
        run: |
          dotnet pack src/Incremental -c Release --no-build -o artifacts/packages
          dotnet pack src/Incremental.Storage.Redis -c Release --no-build -o artifacts/packages
          dotnet pack src/Incremental.Hosting -c Release --no-build -o artifacts/packages
          dotnet pack src/Incremental.Kafka -c Release --no-build -o artifacts/packages
          dotnet pack src/Incremental.Service -c Release --no-build -o artifacts/packages
          dotnet pack src/Incremental.Service.Admin -c Release --no-build -o artifacts/packages
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  # Everything that needs Kafka, Postgres and Kafka Connect: the Kafka library's
  # integration tests, the service's Kafka-backed classes (KafkaService*Tests, which the
  # job above skips) and the example's Kafka smoke, which kills a node and takes over.
  # The stack is the repository's own compose file rather than `services:` containers,
  # for two reasons: Postgres has to be started with `-c wal_level=logical`, which a
  # service container cannot be given, and this way CI runs what a developer runs.
  # These tests skip when the stack is unreachable, so each step also fails if anything
  # was skipped: a green run here means they ran.
  connector-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Start Kafka, Postgres and Kafka Connect
        run: docker compose --profile connectors up -d --wait --wait-timeout 240
      - name: Build
        run: dotnet build -c Release
      - name: Test Kafka against the broker
        run: |
          set -o pipefail
          dotnet test --project tests/Incremental.Kafka.Tests -c Release --no-build | tee kafka-tests.log
          grep -Eq '^\s*skipped: 0\s*$' kafka-tests.log
      - name: Test Service against the broker
        run: |
          set -o pipefail
          dotnet test --project tests/Incremental.Service.Tests -c Release --no-build | tee service-tests.log
          grep -Eq '^\s*skipped: 0\s*$' service-tests.log
      - name: Smoke, enrichment service on Kafka with a killed leader
        run: dotnet run -c Release --no-build --project examples/Incremental.EnrichmentService -- --headless --kafka --prefix "ci-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Measured failover times
        if: always()
        run: |
          cat tests/Incremental.Kafka.Tests/bin/Release/net10.0/measurements.log || true
          cat tests/Incremental.Service.Tests/bin/Release/net10.0/measurements.log || true
      - name: Container logs
        if: failure()
        run: docker compose --profile connectors logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose --profile connectors down -v

  # Scaling assertions, not absolute timings: shared runners are too noisy to gate on
  # wall-clock numbers, so this job asserts that a fixed-size delta costs about the same
  # (bytes allocated, and time within a generous ratio) against small and large operator
  # state. An O(delta) -> O(state) regression overshoots the bounds by ~10x either way.
  perf-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Assert performance contracts
        run: dotnet run -c Release --project benchmarks/Incremental.Benchmarks -- --assert
