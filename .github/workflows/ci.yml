name: CI

# The enrichment-service branch is built on every push so that its work is checked before
# there is a pull request for it; workflow_dispatch runs any branch by hand
# (`gh workflow run CI --ref <branch>`).
on:
  push:
    branches: [main, enrichment-service]
  pull_request:
  workflow_dispatch:
    inputs:
      broker_tests:
        description: "Also run the broker-failure tests on three brokers (the kafka3 compose profile)"
        type: boolean
        default: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build -c Release
      - name: Test
        run: dotnet test --project tests/Dbsp.Tests -c Release --no-build
      # No broker in CI: the integration tests skip, and the ones that need none
      # (SnapshotCutTests) run.
      - name: Test Kafka
        run: dotnet test --project tests/Dbsp.Kafka.Tests -c Release --no-build
      # In memory throughout: the service's tests need no broker. They load real plugin
      # assemblies from the test plugin projects' output directories, which the build made.
      - name: Test Service
        run: dotnet test --project tests/Dbsp.Service.Tests -c Release --no-build
      # The example plugin's own tests: its definitions on PipelineTestHarness, as a
      # plugin author would write them.
      - name: Test example pipelines
        run: dotnet test --project examples/Dbsp.EnrichmentService/Pipelines.Tests -c Release --no-build
      # The smoke tests that need no broker. Each drives the example through its admin API
      # (or prints its narrative), checks every claim against a model and exits 1 on one
      # that does not hold. A few seconds each.
      - name: Smoke, enrichment service on one in-memory node
        run: dotnet run -c Release --no-build --project examples/Dbsp.EnrichmentService -- --headless
      - name: Smoke, enrichment service on two in-memory nodes with a takeover
        run: dotnet run -c Release --no-build --project examples/Dbsp.EnrichmentService -- --headless --nodes 2
      - name: Smoke, trade enrichment on shared tables
        run: dotnet run -c Release --no-build --project examples/Dbsp.TradeEnrichment
      # Validates the NuGet packaging (metadata, XML docs, SourceLink, symbols) on every build.
      - name: Pack
        run: |
          dotnet pack src/Dbsp -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Storage.Redis -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Hosting -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Kafka -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Service.Abstractions -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Service -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Service.Testing -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Service.S3 -c Release --no-build -o artifacts/packages
          dotnet pack src/Dbsp.Service.Admin -c Release --no-build -o artifacts/packages
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg

  # Everything that needs Kafka, Postgres, Kafka Connect and MinIO: the Kafka library's
  # integration tests, the service's Kafka-backed classes (KafkaService*Tests, which the
  # job above skips), the files connector's tests on the S3 store (S3FileConnectorTests,
  # skipped above too) and the example's Kafka smoke, which kills a node and takes over.
  # The stack is the repository's own compose file rather than `services:` containers,
  # for two reasons: Postgres has to be started with `-c wal_level=logical`, which a
  # service container cannot be given, and this way CI runs what a developer runs.
  # These tests skip when the stack is unreachable, so each step also fails if anything
  # was skipped: a green run here means they ran.
  connector-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          # The rolling-upgrade test runs this build against the one from before format
          # levels, which is built from history below.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Start Kafka, Postgres, Kafka Connect and MinIO
        run: docker compose --profile connectors up -d --wait --wait-timeout 240
      - name: Build
        run: dotnet build -c Release
      - name: Test Kafka against the broker
        run: |
          set -o pipefail
          dotnet test --project tests/Dbsp.Kafka.Tests -c Release --no-build | tee kafka-tests.log
          # The summary's lines carry colour codes on a runner: taken out before the match.
          # Two, exactly: KafkaPartitionWatermarkTests' two that kill and freeze a broker,
          # which need three of them (the broker-failures job runs those).
          sed 's/\x1b\[[0-9;]*m//g' kafka-tests.log | grep -Eq '^\s*skipped: 2\s*$'
      - name: Test Service against the broker
        run: |
          set -o pipefail
          dotnet test --project tests/Dbsp.Service.Tests -c Release --no-build | tee service-tests.log
          # Six, exactly: the tests that stop, kill and freeze brokers, which need three of
          # them (the kafka3 compose profile, not started here). The S3 store's tests
          # skip without MinIO, so a seventh skip fails here too.
          sed 's/\x1b\[[0-9;]*m//g' service-tests.log | grep -Eq '^\s*skipped: 6\s*$'
      - name: Smoke, enrichment service on Kafka with a killed leader
        run: dotnet run -c Release --no-build --project examples/Dbsp.EnrichmentService -- --headless --kafka --prefix ci${{ github.run_id }}
      - name: Measured failover times
        if: always()
        run: |
          cat tests/Dbsp.Kafka.Tests/bin/Release/net10.0/measurements.log || true
          cat tests/Dbsp.Service.Tests/bin/Release/net10.0/measurements.log || true
      - name: Container logs
        if: failure()
        run: |
          docker compose --profile connectors logs --no-color --tail 200
          # The broker's log cleaner writes to a file of its own, and a test that waits
          # for it to compact a topic skips (which fails the step above) when it has not:
          # what the cleaner was doing is only here.
          docker compose --profile connectors exec -T kafka sh -c 'tail -n 400 /opt/kafka/logs/log-cleaner.log' || true
      - name: Stop the stack
        if: always()
        run: docker compose --profile connectors down -v

  # The tests that stop, kill and freeze brokers under a running pipeline, on the
  # repository's three-broker compose profile. By hand only
  # (`gh workflow run CI --ref <branch> -f broker_tests=true`): they take the whole of a
  # runner for a quarter of an hour, and what they assert — one leader, nothing lost,
  # the leadership not moved by one broker's loss — depends on three JVMs and two node
  # processes keeping their heartbeats on two shared cores. docs/design/enrichment-service.md
  # (S8, *CI*) has what the runs made of it so far cost and how they ended.
  broker-failures:
    if: github.event_name == 'workflow_dispatch' && inputs.broker_tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Start three brokers
        run: docker compose --profile kafka3 up -d --wait --wait-timeout 240
      - name: Build
        run: dotnet build -c Release
      - name: Broker-failure tests
        env:
          DBSP_KAFKA_BOOTSTRAP: localhost:9192,localhost:9292,localhost:9392
          DBSP_KAFKA_REPLICATION: 3
          DBSP_KAFKA_BROKERS: dbsp-kafka3-1-1,dbsp-kafka3-2-1,dbsp-kafka3-3-1
          DBSP_NODE_LOGS: ${{ runner.temp }}/node-logs
        run: |
          set -o pipefail
          dotnet test --project tests/Dbsp.Service.Tests -c Release --no-build -- --filter-method "*broker*" | tee broker-tests.log
          # Here the brokers are there to be stopped: a skip means the run proved nothing.
          sed 's/\x1b\[[0-9;]*m//g' broker-tests.log | grep -Eq '^\s*skipped: 0\s*$'
          # A broker lost under a topic of several partitions: the watermark waits for
          # the partitions that have no leader, and their records are not late.
          dotnet test --project tests/Dbsp.Kafka.Tests -c Release --no-build -- --filter-method "*ABrokerLost*" | tee kafka-broker-tests.log
          sed 's/\x1b\[[0-9;]*m//g' kafka-broker-tests.log | grep -Eq '^\s*skipped: 0\s*$'
      - name: What the runs measured
        if: always()
        run: |
          cat tests/Dbsp.Service.Tests/bin/Release/net10.0/measurements.log || true
          cat tests/Dbsp.Service.Tests/bin/Release/net10.0/broker-runs.jsonl || true
          cat tests/Dbsp.Kafka.Tests/bin/Release/net10.0/measurements.log || true
      - name: Node logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: broker-failure-node-logs
          path: ${{ runner.temp }}/node-logs
      - name: Broker logs
        if: failure()
        run: docker compose --profile kafka3 logs --no-color --tail 300
      - name: Stop the brokers
        if: always()
        run: docker compose --profile kafka3 down -v

  # Scaling assertions, not absolute timings: shared runners are too noisy to gate on
  # wall-clock numbers, so this job asserts that a fixed-size delta costs about the same
  # (bytes allocated, and time within a generous ratio) against small and large operator
  # state. An O(delta) -> O(state) regression overshoots the bounds by ~10x either way.
  perf-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Assert performance contracts
        run: dotnet run -c Release --project benchmarks/Dbsp.Benchmarks -- --assert
