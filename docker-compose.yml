services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  # The connector stack is behind a profile so `docker compose up -d` stays the quick
  # Redis-only start the test suite needs:
  #   docker compose --profile connectors up -d
  # Local development only: plaintext listeners and throwaway credentials.

  # Single-node Kafka in KRaft mode. From the host: localhost:9092. From other containers
  # on this network: kafka:19092.
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["connectors"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # The tests make many compacted topics, and one of them waits for the cleaner to
      # compact its topic: with one cleaner thread that looks again every 15 s, it can
      # wait behind the others for more than a minute and a half on a slow runner.
      KAFKA_LOG_CLEANER_THREADS: 2
      KAFKA_LOG_CLEANER_BACKOFF_MS: 1000
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Postgres with logical decoding on, which is what Debezium's pgoutput connector reads.
  postgres:
    image: postgres:17-alpine
    profiles: ["connectors"]
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: incremental
      POSTGRES_PASSWORD: incremental
      POSTGRES_DB: incremental
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incremental -d incremental"]
      interval: 2s
      timeout: 2s
      retries: 15

  # Kafka Connect with the Debezium connectors. Register a connector through its REST API
  # on localhost:8083 (database.hostname "postgres", plugin.name "pgoutput").
  debezium:
    image: quay.io/debezium/connect:3.0
    profiles: ["connectors"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: incremental-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  # A production-shaped Kafka, kept out of the default profiles:
  #   docker compose --profile kafka3 up -d
  # Three brokers in KRaft mode, every topic at replication factor 3 with
  # min.insync.replicas 2, so one broker can be stopped and writes with acks=all carry on,
  # and a second cannot. From the host: localhost:9192,localhost:9292,localhost:9392. Point
  # the tests at it with
  #   INCREMENTAL_KAFKA_BOOTSTRAP=localhost:9192,localhost:9292,localhost:9392 INCREMENTAL_KAFKA_REPLICATION=3
  # (and INCREMENTAL_KAFKA_BROKERS, the three container names, for the tests that stop one).
  # No volume: the data goes with the containers. Plaintext, local development only.
  # Each broker has a fixed address on a network of their own. Without one a container
  # that is killed and started again comes back at a new address, and the other brokers
  # spend socket.connection.setup.timeout.ms (ten seconds) on the old one before they
  # look it up again — long enough for the controller quorum to be without a leader for
  # twelve seconds after the next broker goes. A real broker keeps its address.
  # The brokers also name each other by those addresses and not by container name: a
  # stopped container's name no longer resolves, and the lookup — made on the one thread
  # a controller talks to its peers on — takes five seconds to say so. With names, and
  # with the controller listener left to advertise the container's own host name, the
  # two surviving controllers needed eight seconds to agree on a leader.
  # Remove them with `docker compose rm -sf kafka3-1 kafka3-2 kafka3-3`: `down` with a
  # profile also stops the services that have none (Redis).
  kafka3-1: &kafka3
    image: apache/kafka:3.9.0
    profiles: ["kafka3"]
    ports:
      - "9192:9192"
    networks:
      kafka3:
        ipv4_address: 10.89.93.11
    environment: &kafka3-env
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,HOST://:9192,CONTROLLER://10.89.93.11:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.89.93.11:19092,HOST://localhost:9192
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@10.89.93.11:9093,2@10.89.93.12:9093,3@10.89.93.13:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka3-2:
    <<: *kafka3
    ports:
      - "9292:9292"
    networks:
      kafka3:
        ipv4_address: 10.89.93.12
    environment:
      <<: *kafka3-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:19092,HOST://:9292,CONTROLLER://10.89.93.12:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.89.93.12:19092,HOST://localhost:9292

  kafka3-3:
    <<: *kafka3
    ports:
      - "9392:9392"
    networks:
      kafka3:
        ipv4_address: 10.89.93.13
    environment:
      <<: *kafka3-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:19092,HOST://:9392,CONTROLLER://10.89.93.13:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.89.93.13:19092,HOST://localhost:9392

  # A broker that refuses a client it does not know, kept out of the default profiles:
  #   docker compose --profile kafka-sasl up -d
  # From the host: localhost:9492, SASL_PLAINTEXT with OAUTHBEARER. Tokens are unsigned
  # JWTs (the broker's default validator accepts them — a development setting, and the
  # reason this must never be a production one); a session ends with its token, so a
  # client has to refresh and re-authenticate. Access is denied unless an ACL allows it:
  # benchmarks/Incremental.Service.Scale/README.md has the ACLs a service node needs and
  # the command that grants them. The listeners between containers stay plaintext, and
  # whatever arrives on them (ANONYMOUS) is a super user: that is how the ACLs are set.
  kafka-sasl:
    image: apache/kafka:3.9.0
    profiles: ["kafka-sasl"]
    ports:
      - "9492:9492"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: "3L6g3nShT-eMCtK--X86sw"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,HOST://:9492,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-sasl:19092,HOST://localhost:9492
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-sasl:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_SASL_ENABLED_MECHANISMS: OAUTHBEARER
      KAFKA_LISTENER_NAME_HOST_OAUTHBEARER_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required unsecuredLoginStringClaim_sub="broker";'
      KAFKA_CONNECTIONS_MAX_REAUTH_MS: 3600000
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

networks:
  kafka3:
    ipam:
      config:
        - subnet: 10.89.93.0/24

volumes:
  redis-data:
  kafka-data:
  postgres-data:
